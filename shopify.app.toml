# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "029bdc7c4e2d4083740c4b3c634e4274"
application_url = "https://winslet-ai-portraits.fly.dev"
embedded = true
name = "Winslet AI Portraits"
handle = "winslet-ai-portraits"

[access_scopes]
scopes = "write_products,write_publications,read_files,read_cart_transforms,write_cart_transforms"

[product.metafields.app.style_id]
type = "single_line_text_field"
name = "Winslet AI Portraits Style ID"
description = "Links a Shopify product to its Winslet AI Portraits style."

  [product.metafields.app.style_id.access]
  admin = "merchant_read"
  storefront = "public_read"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # The three mandatory GDPR compliance webhooks — declared via
  # `compliance_topics`, not `topics` (that's what the CLI rejects
  # them under). Pushed to Partner Dashboard automatically on the next
  # `shopify app deploy`, same as every sibling app in this account.
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[app_proxy]
url = "https://winslet-ai-portraits.fly.dev/app-proxy"
subpath = "ai-art-studio"
prefix = "apps"

[auth]
redirect_urls = [ "https://winslet-ai-portraits.fly.dev/api/auth" ]

[build]
automatically_update_urls_on_dev = true
